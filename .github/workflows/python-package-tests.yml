# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package tests

on:
  # Triggers the workflow on push or pull request events but only for non-docs commits
  push:
    paths-ignore:
      - CITATION.cff
      - .github/workflows/citation-cff.yml
  pull_request:
    paths-ignore:
      - CITATION.cff
      - .github/workflows/citation-cff.yml

jobs:
  lint:
    name: Lint with ruff
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
    - name: Install dependencies
      run: uv sync --locked --only-group lint
    - name: Lint with ruff
      run: uv run --no-sync ruff check .
    - name: Check formatting with ruff
      run: uv run --no-sync ruff format --check .

  build:
    name: Test on Python ${{ matrix.python-version }} and ${{ matrix.os }}
    needs: lint # don't run if linting failed
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os:
        - ubuntu-latest
        - windows-latest
        # macOS tests do not give the same answer for the symmetry points when using
        # pm-symmetry since bumping dependencies beyond python3.9 - this function purely
        # calls soprano, so the underlying issue is probably there. Disable for now.
        # - macOS-14

    steps:
    - uses: actions/checkout@v6
    - name: Install apt packages
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenblas-dev
    - name: Install choco packages
      if: matrix.os == 'windows-latest'
      run: choco install pkgconfiglite
    - name: Setup conda
      if: matrix.os == 'windows-latest' && matrix.python-version == '3.14'
      uses: conda-incubator/setup-miniconda@v4
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
    - name: Install conda packages
      if: matrix.os == 'windows-latest' && matrix.python-version == '3.14'
      run: conda install openblas
    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install build dependencies
      run: |
        uv venv
        uv pip install pybind11==3.0.1 scipy-openblas64==0.3.30.0.4
      shell: bash # Windows runners have Git Bash installed so this should work on all runners
    - name: Install dependencies
      env:
        UV_NO_BUILD_ISOLATION_PACKAGE: scipy
      run: uv sync --locked --inexact --all-extras --group dev
    - name: Test with pytest
      run: uv run pytest --cov pymuonsuite --cov-report xml
    - name: Upload to Codecov
      if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
