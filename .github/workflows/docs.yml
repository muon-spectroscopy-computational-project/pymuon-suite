name: Build and deploy docs

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for changes to docs
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - "docs/**"
      - .github/workflows/docs.yml

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one deployment at a time, but don't cancel a deployment that is
# already in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Installs only the docs dependency group (mkdocs, pymdown-extensions)
      - name: Install dependencies
        run: uv sync --only-group docs

      # Build the docs
      - name: Build docs
        run: uv run --only-group docs mkdocs build
        working-directory: docs

      # Upload the built site so the deploy job can publish it
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  # Deploy docs only if this is an update to main (pushed or triggered manually)
  deploy:
    name: Deploy docs
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
